name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
    branches: [main]
    tags: ["v*", "mcp-v*"]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

# Least privilege by default; the publish job below adds only what it needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install backend test dependencies into repo venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt

      - name: Install mcp dependencies
        run: npm ci
        working-directory: mcp

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run verification gates
        run: ./scripts/verify

  publish-mcp:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/mcp-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm audit --omit=dev

      - name: Publish if version is new
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version 2>/dev/null | grep -qx "$VER"; then
            echo "$PKG@$VER already on npm; skipping publish"
          else
            npm publish --provenance
          fi
        # Still authenticated with NPM_TOKEN. Moving to npm trusted publishing
        # needs a registry-side trusted publisher entry for this package first.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
